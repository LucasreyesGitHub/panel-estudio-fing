<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Estudio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0a0a0c; --surface:#141417; --surface-2:#1a1a1e; --surface-hover:#1f1f24;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
    --text:#e9e7e2; --text-dim:#87868c; --text-faint:#57565c;
    --accent:#7c9cf7; --accent-soft:rgba(124,156,247,.13);
    --pye:#d8a857; --pye-soft:rgba(216,168,87,.13);
    --arq:#a68bf0; --arq-soft:rgba(166,139,240,.13);
    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  .layout{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:264px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:28px 0;}
  .sidebar-header{padding:0 24px 22px;margin-bottom:8px;}
  .sidebar-header h1{font:400 19px/1.2 var(--serif);margin:0;color:var(--text);letter-spacing:.01em;}
  .nav-item{width:calc(100% - 24px);margin:0 12px 2px;text-align:left;background:none;border:none;color:var(--text-dim);padding:9px 12px;font:500 13.5px var(--sans);cursor:pointer;display:flex;align-items:center;border-radius:9px;transition:background .12s,color .12s;}
  .nav-item:hover{background:var(--surface-hover);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--text);}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;margin-right:11px;display:inline-block;flex-shrink:0;}
  .nav-item .count{margin-left:auto;font-size:11px;color:var(--text-faint);}
  .cronograma-link{display:block;margin:20px 12px 0;padding:11px 14px;color:var(--text-dim);text-decoration:none;font:500 12.5px var(--sans);border-top:1px solid var(--border);padding-top:18px;transition:color .12s;}
  .cronograma-link:hover{color:var(--text);}

  /* Main */
  .main{flex:1;padding:56px 56px 80px;max-width:1040px;}
  .home-grid{display:flex;gap:24px;align-items:flex-start;}
  .home-grid .week-card{flex:1;min-width:0;}
  .home-grid .calendar-card{width:320px;flex-shrink:0;margin-top:0;}
  @media (max-width:820px){ .home-grid{flex-direction:column;} .home-grid .calendar-card{width:100%;} }
  .main h2{font:400 26px/1.25 var(--serif);margin:0 0 6px;letter-spacing:.005em;}
  .main .today{color:var(--text-faint);font:500 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;margin-bottom:36px;}
  .nav-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;transition:border-color .12s,color .12s;}
  .nav-btn:hover{border-color:var(--border-strong);color:var(--text);}
  .nav-btn:disabled{opacity:.3;cursor:default;}

  /* Tarjeta unificada de semana (home) */
  .week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;}
  .week-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .week-card-head .week-label{font:500 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
  .week-nav{display:flex;align-items:center;gap:8px;}
  .materia-rows{display:flex;flex-direction:column;}
  .materia-row{border-top:1px solid var(--border);padding:22px 0;}
  .materia-row:first-child{border-top:none;padding-top:0;}
  .materia-row:last-child{padding-bottom:0;}
  .materia-row-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer;width:fit-content;}
  .materia-row-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .materia-row-head .m-name{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);transition:color .12s;}
  .materia-row-head:hover .m-name{color:var(--text);}
  .materia-row .tema{font:400 18px/1.5 var(--serif);margin-bottom:12px;color:var(--text);}
  .see-material-link{background:none;border:none;color:var(--text-faint);font:500 12px var(--sans);cursor:pointer;padding:0;transition:color .12s;}
  .see-material-link:hover{color:var(--accent);}
  .materials{display:flex;flex-direction:column;gap:2px;}
  .materials a{display:block;padding:9px 4px;color:var(--text-dim);text-decoration:none;font:500 13px var(--sans);border-bottom:1px solid var(--border);transition:color .12s;}
  .materials a:last-child{border-bottom:none;}
  .materials a:hover{color:var(--accent);}
  .materials .empty{padding:4px;font:italic 13px var(--sans);color:var(--text-faint);}
  .badge-current{display:inline-block;font:600 10px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;padding:2px 8px;border-radius:20px;margin-left:10px;vertical-align:middle;}

  /* Calendario (home) */
  .calendar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-top:24px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .cal-month-label{font:400 16px var(--serif);text-transform:capitalize;color:var(--text);}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;}
  .cal-dow{text-align:center;font:600 10px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:24px;}
  .cal-day{background:none;border:none;color:var(--text-dim);cursor:pointer;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;font:500 13px var(--sans);transition:background .12s;}
  .cal-day:hover{background:var(--surface-hover);}
  .cal-day.today{border:1px solid var(--border-strong);color:var(--text);}
  .cal-day.selected{background:var(--accent-soft);color:var(--text);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cal-tasks{border-top:1px solid var(--border);padding-top:20px;}
  .cal-selected-label{font:500 12px var(--sans);text-transform:capitalize;color:var(--text-dim);margin-bottom:12px;}
  .cal-task-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .cal-task-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--surface-2);border-radius:8px;font:500 13px var(--sans);color:var(--text);}
  .cal-task-del{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .12s;}
  .cal-task-del:hover{color:var(--text);}
  .cal-add-row{display:flex;gap:8px;}
  .cal-add-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font:500 13px var(--sans);outline:none;transition:border-color .12s;}
  .cal-add-row input:focus{border-color:var(--border-strong);}
  .cal-add-row input::placeholder{color:var(--text-faint);}

  /* Vista de materia completa */
  .materia-page{max-width:700px;}
  .materia-page-head{display:flex;align-items:center;gap:11px;margin-bottom:8px;}
  .materia-page-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .materia-page-head h2{margin:0;}
  .back-link{background:none;border:none;color:var(--text-faint);font:500 13px var(--sans);cursor:pointer;padding:0 0 24px;display:inline-block;transition:color .12s;}
  .back-link:hover{color:var(--accent);}
  .tema-group{margin-top:36px;}
  .tema-group:first-child{margin-top:32px;}
  .tema-group-label{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px;}
  .week-rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .week-row{padding:20px 24px;border-top:1px solid var(--border);}
  .week-row:first-child{border-top:none;}
  .week-row.is-current{background:var(--accent-soft);}
  .week-row.is-past{opacity:.45;}
  .week-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .week-row .wr-range{font:500 11px var(--sans);color:var(--text-faint);white-space:nowrap;}
  .week-row .wr-tema{font:400 16px/1.5 var(--serif);margin:0 0 10px;color:var(--text);}
  .week-row .materials{flex-direction:column;}
  .week-row .materials a{padding:8px 0;}

  .dot-prog3{background:var(--accent);}
  .dot-pye{background:var(--pye);}
  .dot-arq{background:var(--arq);}
</style>

const MATERIAS = [prog3, pye, arq];

// ---------- Utilidades de fecha ----------
// Parsea "YYYY-MM-DD" como fecha LOCAL (new Date(string) lo parsea como UTC,
// lo cual corre todo un día para atrás en husos negativos como UY — ese fue el bug).
function parseLocalDate(s){
  const [y, mo, d] = s.split('-').map(Number);
  return new Date(y, mo - 1, d);
}

// índice del ítem de una materia cuyo rango contiene una fecha dada (para alinear por semana calendario)
function findIndexForDate(weeks, dateObj){
  for(let i=0;i<weeks.length;i++){
    const s = parseLocalDate(weeks[i].start), e = parseLocalDate(weeks[i].end);
    if(dateObj>=s && dateObj<=e) return i;
  }
  if(dateObj < parseLocalDate(weeks[0].start)) return 0;
  return weeks.length-1;
}

function fmt(d){ return `${d.getDate()}/${d.getMonth()+1}`; }
function mondayOf(d){
  const day = (d.getDay()+6)%7; // lunes=0
  const m = new Date(d);
  m.setDate(d.getDate()-day);
  m.setHours(0,0,0,0);
  return m;
}

// ---------- Grilla de semanas globales (lunes a domingo), unificada entre materias ----------
const allStarts = MATERIAS.flatMap(m => m.weeks.map(w => parseLocalDate(w.start)));
const allEnds = MATERIAS.flatMap(m => m.weeks.map(w => parseLocalDate(w.end)));
const globalStart = mondayOf(new Date(Math.min(...allStarts)));
const globalEnd = new Date(Math.max(...allEnds));

const GLOBAL_WEEKS = [];
{
  let cursor = new Date(globalStart);
  while(cursor <= globalEnd){
    const start = new Date(cursor);
    const end = new Date(cursor); end.setDate(end.getDate()+6);
    GLOBAL_WEEKS.push({ start, end, label: `${fmt(start)} - ${fmt(end)}` });
    cursor.setDate(cursor.getDate()+7);
  }
}

function findGlobalWeekIndexForToday(){
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<GLOBAL_WEEKS.length;i++){
    if(today>=GLOBAL_WEEKS[i].start && today<=GLOBAL_WEEKS[i].end) return i;
  }
  return today < GLOBAL_WEEKS[0].start ? 0 : GLOBAL_WEEKS.length-1;
}

// ---------- Estado ----------
let homeWeekIndex = findGlobalWeekIndexForToday();
let currentView = 'home'; // 'home' | materia.key
let calMonth = (()=>{ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let calSelected = toISO(new Date());

// ---------- Calendario de tareas (persistido en localStorage) ----------
const DOW_ES = ['L','M','X','J','V','S','D'];
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TASKS_KEY = 'panelEstudioTasks';

function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function loadTasks(){ try{ return JSON.parse(localStorage.getItem(TASKS_KEY) || '{}'); } catch(e){ return {}; } }
function saveTasks(t){ localStorage.setItem(TASKS_KEY, JSON.stringify(t)); }

function renderCalendar(){
  const tasks = loadTasks();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById('cal-month-label').textContent = `${MONTHS_ES[m]} ${y}`;

  document.getElementById('cal-dow-row').innerHTML = DOW_ES.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lunes=0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayIso = toISO(new Date());

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  for(let i=0; i<startOffset; i++){
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = toISO(new Date(y, m, day));
    const cell = document.createElement('button');
    cell.className = 'cal-day' + (iso===todayIso ? ' today' : '') + (iso===calSelected ? ' selected' : '');
    const hasTasks = tasks[iso] && tasks[iso].length > 0;
    cell.innerHTML = `<span>${day}</span>${hasTasks ? '<i class="cal-dot"></i>' : ''}`;
    cell.onclick = () => { calSelected = iso; renderCalendar(); };
    grid.appendChild(cell);
  }

  const tasksEl = document.getElementById('cal-tasks');
  const selDate = new Date(calSelected + 'T00:00:00');
  const label = selDate.toLocaleDateString('es-UY', {weekday:'long', day:'numeric', month:'long'});
  const list = tasks[calSelected] || [];
  tasksEl.innerHTML = `
    <div class="cal-selected-label">${label}</div>
    <div class="cal-task-list">
      ${list.length ? list.map((t,i) => `<div class="cal-task-item"><span>${t}</span><button class="cal-task-del" data-i="${i}">×</button></div>`).join('') : '<div class="empty">Sin tareas para este día.</div>'}
    </div>
    <div class="cal-add-row">
      <input type="text" id="cal-task-input" placeholder="Agregar tarea o repaso…" />
      <button class="nav-btn" id="cal-task-add">+</button>
    </div>
  `;

  tasksEl.querySelectorAll('.cal-task-del').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.i, 10);
      const t = loadTasks();
      t[calSelected].splice(i, 1);
      if(t[calSelected].length === 0) delete t[calSelected];
      saveTasks(t);
      renderCalendar();
    };
  });
  const input = document.getElementById('cal-task-input');
  const addTask = () => {
    const val = input.value.trim();
    if(!val) return;
    const t = loadTasks();
    if(!t[calSelected]) t[calSelected] = [];
    t[calSelected].push(val);
    saveTasks(t);
    renderCalendar();
  };
  document.getElementById('cal-task-add').onclick = addTask;
  input.onkeydown = (e) => { if(e.key === 'Enter') addTask(); };

  document.getElementById('cal-prev').onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); };
  document.getElementById('cal-next').onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); };
}

function materialsHtml(w){
  return w.materials.length
    ? w.materials.map(mm => `<a href="${mm.href}" target="_blank">${mm.label}</a>`).join('')
    : '<div class="empty">Sin material generado todavía para esta semana.</div>';
}

// ---------- Render sidebar ----------
function renderSidebar(){
  const el = document.getElementById('sidebar-content');
  el.innerHTML = '';

  const home = document.createElement('button');
  home.className = 'nav-item' + (currentView==='home' ? ' active' : '');
  home.innerHTML = `Panel principal`;
  home.onclick = () => { currentView='home'; render(); };
  el.appendChild(home);

  MATERIAS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (currentView===m.key ? ' active' : '');
    btn.innerHTML = `<span class="dot ${m.dotClass}"></span>${m.name}<span class="count">${m.weeks.length}</span>`;
    btn.onclick = () => { currentView=m.key; render(); };
    el.appendChild(btn);
  });
}

// ---------- Render home (overview unificado por semana) ----------
function renderHome(){
  const main = document.getElementById('main');
  const gw = GLOBAL_WEEKS[homeWeekIndex];
  const isCurrentGlobalWeek = homeWeekIndex === findGlobalWeekIndexForToday();

  main.innerHTML = `
    <h2>Panel principal</h2>
    <div class="today" id="today-label"></div>
    <div class="home-grid">
      <div class="week-card">
        <div class="week-card-head">
          <div>
            <div class="week-label">Semana del ${gw.label}${isCurrentGlobalWeek ? '<span class="badge-current">ACTUAL</span>' : ''}</div>
          </div>
          <div class="week-nav">
            <button class="nav-btn" id="wk-prev" ${homeWeekIndex===0?'disabled':''}>‹</button>
            <button class="nav-btn" id="wk-next" ${homeWeekIndex===GLOBAL_WEEKS.length-1?'disabled':''}>›</button>
          </div>
        </div>
        <div class="materia-rows" id="materia-rows"></div>
      </div>

      <div class="calendar-card">
        <div class="cal-head">
          <div class="cal-month-label" id="cal-month-label"></div>
          <div class="week-nav">
            <button class="nav-btn" id="cal-prev">‹</button>
            <button class="nav-btn" id="cal-next">›</button>
          </div>
        </div>
        <div class="cal-dow-row" id="cal-dow-row"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-tasks" id="cal-tasks"></div>
      </div>
    </div>
  `;
  document.getElementById('today-label').textContent =
    'Hoy: ' + new Date().toLocaleDateString('es-UY', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  renderCalendar();

  const rowsEl = document.getElementById('materia-rows');
  MATERIAS.forEach(m => {
    const idx = findIndexForDate(m.weeks, gw.start);
    const w = m.weeks[idx];
    const row = document.createElement('div');
    row.className = 'materia-row';
    row.innerHTML = `
      <div class="materia-row-head" data-open="${m.key}">
        <span class="dot ${m.dotClass}"></span>
        <span class="m-name">${m.name}</span>
      </div>
      <div class="tema">${w.tema}</div>
      <button class="see-material-link" data-open="${m.key}">Ver material de esta materia →</button>
    `;
    rowsEl.appendChild(row);
  });

  rowsEl.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => { currentView = el.dataset.open; render(); };
  });
  document.getElementById('wk-prev').onclick = () => shiftHomeWeek(-1);
  document.getElementById('wk-next').onclick = () => shiftHomeWeek(1);
}

function shiftHomeWeek(delta){
  const newIdx = homeWeekIndex + delta;
  if(newIdx>=0 && newIdx<GLOBAL_WEEKS.length){
    homeWeekIndex = newIdx;
    renderHome();
  }
}

// ---------- Render vista de materia completa (árbol de temas) ----------
function isItemCurrent(item){
  if(!item.start || !item.end) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return today >= parseLocalDate(item.start) && today <= parseLocalDate(item.end);
}
function isItemPast(item){
  if(!item.end) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return today > parseLocalDate(item.end);
}
function itemRangeLabel(item){
  if(!item.start || !item.end) return '';
  const s = parseLocalDate(item.start), e = parseLocalDate(item.end);
  return item.start === item.end ? fmt(s) : `${fmt(s)} - ${fmt(e)}`;
}

function renderMateriaPage(m){
  const main = document.getElementById('main');
  const totalTemas = m.temas.reduce((n,g)=>n+g.items.length, 0);
  main.innerHTML = `
    <div class="materia-page">
      <button class="back-link" id="back-btn">‹ Volver al panel principal</button>
      <div class="materia-page-head">
        <span class="dot ${m.dotClass}"></span>
        <h2>${m.name}</h2>
      </div>
      <div class="today">${totalTemas} temas del curso · todo el material subido hasta ahora, agrupado por tema</div>
      <div id="tema-groups"></div>
    </div>
  `;
  document.getElementById('back-btn').onclick = () => { currentView='home'; render(); };

  const container = document.getElementById('tema-groups');
  let currentEl = null;
  m.temas.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'tema-group';
    groupEl.innerHTML = `<div class="tema-group-label">${group.label}</div>`;

    const rows = document.createElement('div');
    rows.className = 'week-rows';
    group.items.forEach(item => {
      const cur = isItemCurrent(item);
      const row = document.createElement('div');
      row.className = 'week-row' + (cur ? ' is-current' : (isItemPast(item) ? ' is-past' : ''));
      const rangeLabel = itemRangeLabel(item);
      row.innerHTML = `
        <div class="week-row-top">
          <div class="wr-tema" style="margin:0;">${item.tema}${cur ? '<span class="badge-current">ACTUAL</span>' : ''}</div>
          ${rangeLabel ? `<div class="wr-range">${rangeLabel}</div>` : ''}
        </div>
        <div class="materials">${materialsHtml(item)}</div>
      `;
      rows.appendChild(row);
      if(cur) currentEl = row;
    });
    groupEl.appendChild(rows);
    container.appendChild(groupEl);
  });

  if(currentEl){
    setTimeout(()=> currentEl.scrollIntoView({behavior:'smooth', block:'center'}), 50);
  }
}

// ---------- Router ----------
function render(){
  renderSidebar();
  if(currentView === 'home'){
    renderHome();
  } else {
    const m = MATERIAS.find(x=>x.key===currentView);
    renderMateriaPage(m);
  }
}

render();
